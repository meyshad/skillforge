name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Validate plugins and skills
        run: python scripts/validate.py
      - name: Unit tests
        run: python -m unittest discover -v tests
      - name: Scan repository for secrets
        run: python plugins/security/skills/secret-scanner/scripts/scan_secrets.py .

  installer:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck scripts/install.sh
      - name: Install, re-install and uninstall into a temp dir
        run: |
          dest="$(mktemp -d)"
          ./scripts/install.sh --list
          ./scripts/install.sh --dir "$dest"
          test "$(find "$dest" -name SKILL.md | wc -l)" -eq 18
          ./scripts/install.sh --dir "$dest" --force --plugin security
          ./scripts/install.sh --dir "$dest" --uninstall
          test -z "$(ls -A "$dest")"
